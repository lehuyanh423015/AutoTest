[project]
name = "autotest"
version = "0.1.0"
description = "LLM-based automatic unit test generation system"
requires-python = ">=3.12,<3.13"

dependencies = [
    "psutil==7.2.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "coverage==7.16.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = '-ra -m "not mutation"'
markers = [
    "ollama: integration tests requiring a local Ollama server and model",
    "mutation: integration tests requiring WSL and the pinned Mutmut environment",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "2026-09-15T00:00:00Z"
